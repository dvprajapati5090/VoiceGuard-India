version: "3.9"
services:
  voiceguard:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENV=development
      - DATABASE_URL=sqlite+aiosqlite:///./voiceguard_audit.db
      - MODEL_NAME=facebook/wav2vec2-large-xlsr-53
      - SCORE_THRESHOLD=70
      - MAX_CHUNK_BYTES=500000
      - SESSION_TTL_SECONDS=3600
    volumes:
      - ./voiceguard_audit.db:/app/voiceguard_audit.db
    restart: unless-stopped
